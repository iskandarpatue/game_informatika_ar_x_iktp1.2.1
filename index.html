<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis AR: Tangkap Kupu-Kupu Data</title>
    
    <!-- Library CSS Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Library Firebase (Wajib untuk Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #111; }
        
        /* Layar besar (Laptop/PID): Kursor hilang diganti hologram */
        @media (min-width: 768px) { body, .interactive { cursor: none; } }
        /* Layar kecil (HP): Kursor default untuk sentuhan alami */
        @media (max-width: 767px) { #custom-cursor { display: none !important; } }

        /* Kursor Hologram */
        #custom-cursor {
            position: fixed; top: 50%; left: 50%; width: 60px; height: 60px;
            border: 4px solid rgba(56, 189, 248, 0.9); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 99999;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.8), inset 0 0 15px rgba(14, 165, 233, 0.5);
            transition: transform 0.05s ease-out;
        }
        #custom-cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; background: #ef4444; border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 15px #ef4444;
        }
        .cursor-click { transform: translate(-50%, -50%) scale(0.7) !important; border-color: #10b981 !important; }

        /* Latar Belakang Kamera */
        #webcam-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transform: scaleX(-1);
        }

        /* Lapisan UI */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(8px); 
            border: 2px solid rgba(56, 189, 248, 0.8); border-radius: 20px;
            width: 90%; max-width: 650px; padding: 30px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #0f172a;
        }

        #soal-panel {
            position: absolute; top: 2%; width: 95%; max-width: 950px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px);
            border-radius: 15px; padding: 15px 25px;
            border-bottom: 5px solid #0ea5e9; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .btn {
            background: #0ea5e9; color: white; padding: 15px 30px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; width: 100%; transition: 0.2s;
            border: 2px solid #0284c7; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #94a3b8; border-color: #64748b; cursor: not-allowed; }
        .btn-secondary { background: #64748b; border-color: #475569; margin-top: 10px; }

        #falling-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; overflow: hidden;
        }

        /* Desain Kupu-Kupu */
        .butterfly-container {
            position: absolute; pointer-events: auto; 
            width: 18%; max-width: 130px; 
            text-align: center; display: flex; flex-direction: column; align-items: center;
            animation: fallAnimation linear infinite;
            transition: transform 0.2s;
        }
        .butterfly-icon {
            font-size: 3rem; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
            animation: flutter 2s ease-in-out infinite alternate;
        }
        .butterfly-text {
            background: rgba(255,255,255,0.95); color: #0f172a;
            font-weight: 800; font-size: 0.85rem; padding: 5px 10px;
            border-radius: 10px; border: 2px solid #0ea5e9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: -10px; z-index: 2; word-wrap: break-word; line-height: 1.2;
        }
        
        .butterfly-container.selected .butterfly-icon { filter: hue-rotate(120deg) drop-shadow(0 0 20px #f59e0b); }
        .butterfly-container.selected .butterfly-text { background: #f59e0b; color: white; border-color: #b45309; }

        @keyframes fallAnimation { 0% { top: -150px; } 100% { top: 110%; } }
        @keyframes flutter {
            0% { transform: rotate(-15deg) translateX(-10px); }
            100% { transform: rotate(15deg) translateX(10px); }
        }

        #btn-submit-multiple {
            position: absolute; bottom: 5%; z-index: 25; width: 50%; max-width: 350px;
            background: #10b981; border-color: #047857; font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <video id="webcam-bg" autoplay playsinline muted></video>
    <div id="falling-container"></div>

    <div id="ui-layer">
        
        <!-- Layar Mulai -->
        <div id="screen-start" class="glass-panel interactive">
            <h1 class="text-3xl font-extrabold text-sky-800 mb-2">Taman Data: Kupu-Kupu</h1>
            <p class="text-gray-800 font-bold mb-6">Materi: Kualitas & Pengumpulan Data. Tangkap jawaban yang benar di udara!</p>
            <input type="text" id="input-nama" class="w-full px-4 py-3 border-2 border-sky-400 rounded-xl mb-4 text-center text-lg focus:outline-none interactive" placeholder="Ketik Nama Siswa...">
            <button class="btn interactive" onclick="mulaiGame()">MULAI TANTANGAN</button>
            <button id="btn-switch-cam" class="btn btn-secondary hidden interactive" onclick="switchCamera()">🔄 GANTI KAMERA (DEPAN/BELAKANG)</button>
        </div>

        <!-- Panel Soal -->
        <div id="soal-panel" class="hidden interactive">
            <div class="flex justify-between items-center mb-2 border-b-2 border-sky-300 pb-2">
                <span id="quiz-progress" class="font-bold text-sky-900 bg-sky-200 px-3 py-1 rounded-full text-xs md:text-sm">Soal 1/20</span>
                <span id="quiz-instruksi" class="font-extrabold text-red-600 animate-pulse text-xs md:text-sm">TANGKAP 1 JAWABAN</span>
                <span id="quiz-score" class="font-bold text-gray-800 bg-white/70 px-3 py-1 rounded-full text-xs md:text-sm">Skor: 0</span>
            </div>
            <h2 id="question-text" class="text-sm md:text-lg font-extrabold text-gray-900 drop-shadow-sm leading-snug">Memuat soal...</h2>
        </div>

        <button id="btn-submit-multiple" class="btn hidden interactive" onclick="submitMultiAnswer()">CEK JAWABAN</button>

        <!-- Panel Pembahasan -->
        <div id="screen-feedback" class="glass-panel hidden interactive bg-white/95">
            <h1 id="fb-title" class="text-3xl font-extrabold mb-2">BENAR!</h1>
            <div class="bg-gray-100 p-3 rounded-xl mb-4 border border-gray-300 text-left">
                <p class="text-xs font-bold text-gray-500 mb-1">Jawaban Benar:</p>
                <p id="fb-correct-ans" class="font-bold text-sky-700 mb-2 text-sm">[Jawaban]</p>
                <p class="text-xs font-bold text-gray-500 mb-1">Penjelasan:</p>
                <p id="fb-explanation" class="text-sm text-gray-800 leading-tight">[Penjelasan]</p>
            </div>
            <button class="btn interactive" onclick="soalSelanjutnya()">LANJUT</button>
        </div>

        <!-- Layar Hasil -->
        <div id="screen-result" class="glass-panel hidden interactive bg-white/95">
            <h1 class="text-4xl font-extrabold text-sky-700 mb-2">Misi Selesai!</h1>
            <p class="text-xl font-bold text-gray-700 mb-4">Hebat, <span id="result-name">Siswa</span>!</p>
            
            <div class="flex justify-around mb-4 mt-2">
                <div class="bg-green-100 p-3 rounded-xl w-5/12 border-2 border-green-400">
                    <p class="text-green-800 font-bold text-sm">Benar</p>
                    <p id="result-benar" class="text-3xl font-extrabold text-green-600">0</p>
                </div>
                <div class="bg-red-100 p-3 rounded-xl w-5/12 border-2 border-red-400">
                    <p class="text-red-800 font-bold text-sm">Salah</p>
                    <p id="result-salah" class="text-3xl font-extrabold text-red-600">0</p>
                </div>
            </div>
            
            <div class="bg-sky-100 border-4 border-sky-400 p-3 rounded-2xl mb-4 shadow-inner">
                <p class="text-sky-800 font-bold text-sm">NILAI AKHIR</p>
                <p id="result-nilai" class="text-5xl font-extrabold text-sky-600">100</p>
            </div>
            
            <!-- Tombol ini teksnya akan berubah dinamis saat menyimpan ke DB -->
            <button id="btn-ulang-game" class="btn interactive" onclick="ulangGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJECT_ID.firebaseapp.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==========================================
        // 2. LOGIKA KURSOR KUSTOM
        // ==========================================
        if (window.innerWidth >= 768) {
            const customCursor = document.getElementById('custom-cursor');
            document.addEventListener('mousemove', (e) => {
                customCursor.style.left = e.clientX + 'px';
                customCursor.style.top = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => customCursor.classList.add('cursor-click'));
            document.addEventListener('mouseup', () => customCursor.classList.remove('cursor-click'));
        }

        // ==========================================
        // 3. SISTEM KAMERA
        // ==========================================
        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentStream = null;

        async function initCamera() {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam-bg').srcObject = currentStream;
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                if (videoDevices.length > 1) {
                    document.getElementById('btn-switch-cam').classList.remove('hidden');
                }
            } catch (err) { console.warn("Kamera error", err); }
        }

        async function switchCamera() {
            if (videoDevices.length < 2) return;
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            const deviceId = videoDevices[currentDeviceIndex].deviceId;
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } });
                const isUserCam = videoDevices[currentDeviceIndex].label.toLowerCase().includes('front');
                document.getElementById('webcam-bg').style.transform = isUserCam ? "scaleX(-1)" : "none";
                document.getElementById('webcam-bg').srcObject = currentStream;
            } catch (err) { console.error("Gagal ganti", err); }
        }
        initCamera();

        // ==========================================
        // 4. FUNGSI PENGACAK SOAL (Fisher-Yates)
        // ==========================================
        function acakArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // ==========================================
        // 5. DATABASE SOAL (20 SOAL TOTAL)
        // ==========================================
        const questions = [
            // 1-10: SOAL REGULER
            { type: "single", question: "Ciri data berkualitas yang mensyaratkan data harus sesuai dengan keadaan sebenarnya, tanpa salah catat adalah...", options: [{text: "Konsisten", correct: false}, {text: "Lengkap", correct: false}, {text: "Akurat", correct: true}, {text: "Terkini", correct: false}, {text: "Relevan", correct: false}], explanation: "Akurat berarti data yang dicatat benar-benar mencerminkan fakta di lapangan." },
            { type: "single", question: "Data nama, jenis ikan, berat, dan harga harus terisi semua tanpa ada kolom yang kosong. Hal ini memenuhi ciri data yang...", options: [{text: "Lengkap", correct: true}, {text: "Akurat", correct: false}, {text: "Relevan", correct: false}, {text: "Konsisten", correct: false}, {text: "Terkini", correct: false}], explanation: "Data yang lengkap berarti semua bagian data atau atribut penting telah terisi seluruhnya." },
            { type: "single", question: "Format penulisan, satuan, dan istilah yang seragam di seluruh data (misal semua tanggal ditulis hh/bb/tttt) mencerminkan ciri data...", options: [{text: "Terkini", correct: false}, {text: "Konsisten", correct: true}, {text: "Akurat", correct: false}, {text: "Relevan", correct: false}, {text: "Lengkap", correct: false}], explanation: "Konsistensi memastikan seluruh data mengikuti aturan atau format baku yang sama." },
            { type: "single", question: "Mencatat warna perahu padahal tujuan pengumpulan datanya adalah menghitung hasil tangkapan ikan akan melanggar ciri data...", options: [{text: "Akurat", correct: false}, {text: "Konsisten", correct: false}, {text: "Relevan", correct: true}, {text: "Lengkap", correct: false}, {text: "Terkini", correct: false}], explanation: "Relevan berarti informasi yang dikumpulkan berkaitan langsung dengan tujuan analisis yang dilakukan." },
            { type: "single", question: "Menggunakan harga ikan tahun lalu untuk menentukan harga hari ini berarti data tersebut tidak memenuhi ciri...", options: [{text: "Terkini", correct: true}, {text: "Relevan", correct: false}, {text: "Konsisten", correct: false}, {text: "Akurat", correct: false}, {text: "Lengkap", correct: false}], explanation: "Data terkini adalah data yang tidak kedaluwarsa dan relevan dengan waktu saat ini." },
            { type: "single", question: "Menimbang ikan di dermaga atau mewawancarai nelayan secara langsung menghasilkan sumber data berupa...", options: [{text: "Sekunder", correct: false}, {text: "Kualitatif", correct: false}, {text: "Tersier", correct: false}, {text: "Primer", correct: true}, {text: "Abstrak", correct: false}], explanation: "Data primer adalah data yang dikumpulkan secara langsung oleh peneliti dari sumber pertama." },
            { type: "single", question: "Laporan tahunan koperasi nelayan atau data statistik dari kantor desa merupakan contoh dari sumber data...", options: [{text: "Primer", correct: false}, {text: "Kuantitatif", correct: false}, {text: "Sekunder", correct: true}, {text: "Observasi", correct: false}, {text: "Angket", correct: false}], explanation: "Data sekunder merupakan data yang sudah dikumpulkan dan dipublikasikan oleh pihak/organisasi lain." },
            { type: "single", question: "Menanyakan langsung kepada ketua koperasi nelayan mengenai kendala penjualan ikan menggunakan teknik...", options: [{text: "Observasi", correct: false}, {text: "Wawancara", correct: true}, {text: "Angket", correct: false}, {text: "Dokumentasi", correct: false}, {text: "Pengukuran", correct: false}], explanation: "Wawancara adalah teknik mengumpulkan data melalui proses tanya jawab langsung dengan narasumber." },
            { type: "single", question: "Membagikan formulir daring (online) untuk mengetahui tingkat kepuasan wisatawan merupakan teknik...", options: [{text: "Wawancara", correct: false}, {text: "Observasi", correct: false}, {text: "Pengukuran", correct: false}, {text: "Angket", correct: true}, {text: "Dokumentasi", correct: false}], explanation: "Angket (Kuesioner) memungkinkan pengumpulan pendapat tertulis dari responden dalam jumlah besar." },
            { type: "multiple", max: 2, question: "Berdasarkan jenisnya, data dibagi menjadi Kuantitatif (angka) dan Kualitatif (kategori). Manakah contoh data Kualitatif? (PILIH 2)", options: [{text: "Jenis Ikan", correct: true}, {text: "Berat 40kg", correct: false}, {text: "Harga Rp30rb", correct: false}, {text: "Kesan Pantai", correct: true}, {text: "Suhu 32°C", correct: false}], explanation: "Data kualitatif berupa kategori, uraian, atau pendapat (misal jenis ikan tongkol, kesan pantai bersih)." },

            // 11-15: SOAL BENAR-SALAH (Kombinasi Pernyataan)
            { type: "single", question: "Cermati 3 pernyataan ini:<br>1. Data lengkap artinya tidak ada kolom kosong.<br>2. Data akurat harus selalu angka.<br>3. Data terkini berarti belum usang.<br><br>Manakah pernyataan yang BENAR?", options: [{text: "1 dan 3", correct: true}, {text: "1 dan 2", correct: false}, {text: "2 dan 3", correct: false}, {text: "Semua Benar", correct: false}, {text: "Semua Salah", correct: false}], explanation: "Pernyataan 2 SALAH karena data akurat tidak harus berupa angka (bisa juga kualitatif yang sesuai fakta)." },
            { type: "single", question: "Perhatikan 3 pernyataan SUMBER DATA:<br>1. Wawancara nelayan menghasilkan data primer.<br>2. Laporan desa adalah data sekunder.<br>3. Data primer didapat dari tulisan orang lain.<br><br>Mana yang BENAR?", options: [{text: "1 dan 2", correct: true}, {text: "1 dan 3", correct: false}, {text: "2 dan 3", correct: false}, {text: "Hanya 3", correct: false}, {text: "Semua Benar", correct: false}], explanation: "Pernyataan 3 SALAH karena data yang didapat dari tulisan/penelitian orang lain disebut data sekunder." },
            { type: "single", question: "Evaluasi 3 pernyataan TEKNIK PENGUMPULAN ini:<br>1. Angket cocok mengukur suhu air laut.<br>2. Observasi dilakukan dengan mengamati langsung.<br>3. Menimbang ikan termasuk pengukuran.<br><br>Manakah yang BENAR?", options: [{text: "2 dan 3", correct: true}, {text: "1 dan 2", correct: false}, {text: "1 dan 3", correct: false}, {text: "Semua Benar", correct: false}, {text: "Semua Salah", correct: false}], explanation: "Pernyataan 1 SALAH karena suhu air laut harus menggunakan teknik PENGUKURAN (termometer), bukan angket." },
            { type: "single", question: "Cermati 3 pernyataan JENIS DATA berikut:<br>1. 'Harga Rp30.000' = data kuantitatif.<br>2. 'Pantai kotor' = data kualitatif.<br>3. Data kualitatif selalu dapat dihitung kalkulator.<br><br>Mana yang BENAR?", options: [{text: "1 dan 2", correct: true}, {text: "2 dan 3", correct: false}, {text: "1 dan 3", correct: false}, {text: "Semua Benar", correct: false}, {text: "Semua Salah", correct: false}], explanation: "Pernyataan 3 SALAH karena data kualitatif (seperti pendapat) tidak dapat dihitung matematis dengan kalkulator." },
            { type: "single", question: "Perhatikan 3 pernyataan KUALITAS DATA ini:<br>1. Relevan = data sesuai tujuan awal.<br>2. Konsisten = format ditulis seragam.<br>3. Data salah ketik masih bisa disebut akurat.<br><br>Mana yang BENAR?", options: [{text: "1 dan 2", correct: true}, {text: "1 dan 3", correct: false}, {text: "2 dan 3", correct: false}, {text: "Hanya 1", correct: false}, {text: "Semua Benar", correct: false}], explanation: "Pernyataan 3 SALAH karena data yang kotor akibat salah ketik (typo) jelas menjadi tidak akurat." },

            // 16-20: SOAL MULTIPLE JAWABAN (Maksimal 3)
            { type: "multiple", max: 3, question: "Di antara pilihan berikut, manakah yang termasuk ke dalam ciri-ciri Data Berkualitas? (PILIH MAKSIMAL 3)", options: [{text: "Akurat", correct: true}, {text: "Subjektif", correct: false}, {text: "Relevan", correct: true}, {text: "Anonim", correct: false}, {text: "Terkini", correct: true}], explanation: "Data berkualitas memiliki 5 ciri: Akurat, Lengkap, Konsisten, Relevan, dan Terkini." },
            { type: "multiple", max: 3, question: "Manakah dari pilihan di bawah ini yang merupakan sumber DATA SEKUNDER bagi seorang siswa? (PILIH MAKSIMAL 3)", options: [{text: "Laporan BPS", correct: true}, {text: "Wawancara Kades", correct: false}, {text: "Arsip Desa", correct: true}, {text: "Buku Koperasi", correct: true}, {text: "Observasi Kelas", correct: false}], explanation: "Data sekunder adalah data yang sudah tercatat dan dipublikasikan sebelumnya, seperti Laporan, Arsip, dan Buku Catatan." },
            { type: "multiple", max: 3, question: "Metode atau teknik apa saja yang umum digunakan untuk mengumpulkan data mentah? (PILIH MAKSIMAL 3)", options: [{text: "Wawancara", correct: true}, {text: "Manipulasi", correct: false}, {text: "Observasi", correct: true}, {text: "Menghapus", correct: false}, {text: "Angket", correct: true}], explanation: "Teknik pengumpulan data yang benar adalah Observasi, Wawancara, Angket, Dokumentasi, dan Pengukuran." },
            { type: "multiple", max: 3, question: "Manakah kondisi yang menyebabkan sebuah data menjadi 'KOTOR' (tidak valid)? (PILIH MAKSIMAL 3)", options: [{text: "Ada Kolom Kosong", correct: true}, {text: "Salah Ketik Nama", correct: true}, {text: "Format Seragam", correct: false}, {text: "Data Konsisten", correct: false}, {text: "Nilai Minus (-15kg)", correct: true}], explanation: "Data kotor terjadi akibat adanya duplikasi, data kosong, salah ketik, format tidak seragam, dan nilai tidak wajar." },
            { type: "multiple", max: 3, question: "Berdasarkan catatan nelayan, manakah yang termasuk ke dalam Data KUANTITATIF? (PILIH MAKSIMAL 3)", options: [{text: "Berat 40 Kg", correct: true}, {text: "Cuaca Cerah", correct: false}, {text: "Harga Rp50rb", correct: true}, {text: "Perahu Biru", correct: false}, {text: "150 Ekor Ikan", correct: true}], explanation: "Data kuantitatif adalah data yang direpresentasikan dalam wujud angka/besaran (Berat, Harga, dan Jumlah)." }
        ];

        let currentQuestion = 0, score = 0, benar = 0, salah = 0, playerName = "", isAnswering = false, selectedBoxes = [];

        // ==========================================
        // 6. LOGIKA PERMAINAN
        // ==========================================
        function mulaiGame() {
            playerName = document.getElementById('input-nama').value || "Siswa";
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('soal-panel').classList.remove('hidden');
            
            // Acak urutan soal
            acakArray(questions);
            
            currentQuestion = 0; score = 0; benar = 0; salah = 0;
            tampilkanSoal();
        }

        function ulangGame() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('input-nama').value = ""; 
            
            if (window.innerWidth >= 768) {
                const cursor = document.getElementById('custom-cursor');
                if(cursor) cursor.style.display = 'block';
            }
        }

        function tampilkanSoal() {
            isAnswering = true;
            selectedBoxes = [];
            document.getElementById('btn-submit-multiple').classList.add('hidden');
            document.getElementById('screen-feedback').classList.add('hidden');
            
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerHTML = q.question;
            document.getElementById('quiz-progress').innerText = `Soal ${currentQuestion + 1} / 20`;
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
            
            const instruksi = document.getElementById('quiz-instruksi');
            if (q.type === 'multiple') {
                instruksi.innerText = `TANGKAP MAKSIMAL ${q.max} KUPU-KUPU`;
                instruksi.className = "font-extrabold text-orange-500 animate-pulse text-xs md:text-sm";
            } else {
                instruksi.innerText = `TANGKAP 1 JAWABAN`;
                instruksi.className = "font-extrabold text-red-600 animate-pulse text-xs md:text-sm";
            }

            const container = document.getElementById('falling-container');
            container.innerHTML = "";
            const leftPositions = [2, 22, 42, 62, 82]; 
            
            // Acak urutan pilihan jawaban
            const shuffledOptions = [...q.options];
            acakArray(shuffledOptions);

            shuffledOptions.forEach((opt, index) => {
                const butterfly = document.createElement('div');
                butterfly.className = "butterfly-container interactive";
                butterfly.innerHTML = `<div class="butterfly-icon">🦋</div><div class="butterfly-text">${opt.text}</div>`;
                
                butterfly.style.left = `${leftPositions[index]}%`; 
                const baseSpeed = q.question.length > 100 ? 10 : 7;
                butterfly.style.animationDuration = `${Math.random() * 4 + baseSpeed}s`; 
                butterfly.style.animationDelay = `${index * 0.6}s`;

                butterfly.onclick = () => handleBoxClick(butterfly, opt, q);
                container.appendChild(butterfly);
            });
        }

        function handleBoxClick(box, opt, q) {
            if(!isAnswering) return;

            if (q.type === 'single') {
                isAnswering = false;
                evaluasiJawaban([opt.text], q);
            } else {
                if (box.classList.contains('selected')) {
                    box.classList.remove('selected');
                    box.style.animationPlayState = 'running';
                    selectedBoxes = selectedBoxes.filter(b => b.text !== opt.text);
                } else {
                    if (selectedBoxes.length >= q.max) {
                        alert(`Maksimal memilih ${q.max} jawaban!`); return;
                    }
                    box.classList.add('selected');
                    box.style.animationPlayState = 'paused';
                    selectedBoxes.push({ text: opt.text });
                }

                if (selectedBoxes.length > 0) document.getElementById('btn-submit-multiple').classList.remove('hidden');
                else document.getElementById('btn-submit-multiple').classList.add('hidden');
            }
        }

        function submitMultiAnswer() {
            if (!isAnswering) return;
            isAnswering = false;
            document.getElementById('btn-submit-multiple').classList.add('hidden');
            evaluasiJawaban(selectedBoxes.map(s => s.text), questions[currentQuestion]);
        }

        function evaluasiJawaban(jawabanSiswa, q) {
            document.getElementById('falling-container').innerHTML = ""; 
            const kunciJawaban = q.options.filter(o => o.correct).map(o => o.text);
            const isBenar = (jawabanSiswa.length === kunciJawaban.length) && jawabanSiswa.every(j => kunciJawaban.includes(j));

            const fbScreen = document.getElementById('screen-feedback');
            const fbTitle = document.getElementById('fb-title');
            
            fbScreen.classList.remove('hidden');
            document.getElementById('fb-correct-ans').innerText = kunciJawaban.join(" | ");
            document.getElementById('fb-explanation').innerText = q.explanation;

            if (isBenar) {
                benar++; score += 5; // 20 soal x 5 = 100 poin
                fbTitle.innerText = "🎉 BENAR!";
                fbTitle.className = "text-3xl font-extrabold mb-2 text-green-600";
            } else {
                salah++;
                fbTitle.innerText = "❌ KURANG TEPAT!";
                fbTitle.className = "text-3xl font-extrabold mb-2 text-red-600";
            }
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
        }

        function soalSelanjutnya() {
            currentQuestion++;
            if (currentQuestion < 20) { tampilkanSoal(); } 
            else { tampilkanHasil(); }
        }

        function tampilkanHasil() {
            document.getElementById('soal-panel').classList.add('hidden');
            document.getElementById('screen-feedback').classList.add('hidden');
            
            const resultScreen = document.getElementById('screen-result');
            resultScreen.classList.remove('hidden');

            const finalScore = Math.round(score);
            document.getElementById('result-name').innerText = playerName;
            document.getElementById('result-benar').innerText = benar;
            document.getElementById('result-salah').innerText = salah;
            document.getElementById('result-nilai').innerText = finalScore;
            
            const cursor = document.getElementById('custom-cursor');
            if(cursor) cursor.style.display = 'none';

            // ==========================================
            // 7. SIMPAN DATA KE FIREBASE
            // ==========================================
            const btnUlang = document.getElementById('btn-ulang-game');
            const teksAsli = "MAIN LAGI";
            btnUlang.innerText = "MENYIMPAN KE DATABASE...";
            btnUlang.disabled = true;

            // Simpan ke collection bernama "rekap_nilai_ar"
            db.collection("rekap_nilai_ar").add({
                nama_siswa: playerName,
                jumlah_benar: benar,
                jumlah_salah: salah,
                nilai_akhir: finalScore,
                waktu_pengerjaan: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then((docRef) => {
                console.log("Data berhasil tersimpan dengan ID: ", docRef.id);
                btnUlang.innerText = teksAsli;
                btnUlang.disabled = false;
            })
            .catch((error) => {
                console.error("Gagal menyimpan data ke Firebase: ", error);
                btnUlang.innerText = "GAGAL SIMPAN. MAIN LAGI?";
                btnUlang.disabled = false;
            });
        }
    </script>
</body>
</html>
